# Bygger appen och lägger ut den på GitHub Pages vid varje push till main.
# Innehållet i boken ligger krypterat i public/vault.bin; inget lösenord behövs här.
name: Publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bygg
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Kontrollera att inget okrypterat innehåll följer med
        run: test ! -e dist/content && test -s dist/vault.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
